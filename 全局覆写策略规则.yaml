# ================= 分流规则（前置插入，优先级高于订阅自带规则） =================
rules:
  # ================= 自定义常用网站（优先级最高，方便随时修改） =================
  - "DOMAIN-SUFFIX,greasyfork.org,节点选择"
  - "DOMAIN-SUFFIX,google.com,节点选择"
  - "DOMAIN-SUFFIX,baidu.com,DIRECT"
  # ================= 规则集分流 =================
  - "RULE-SET,本地网络,DIRECT"
  - "RULE-SET,广告白名单,DIRECT"
  - "RULE-SET,广告过滤,广告拦截"
  - "RULE-SET,应用广告,应用净化"
  - "RULE-SET,国内直连,DIRECT"
  - "RULE-SET,专用代理,专用节点"
  - "RULE-SET,其他代理,其他节点"
  - "RULE-SET,通用代理,节点选择"
  - "GEOIP,CN,DIRECT,no-resolve"
  - "MATCH,漏网之鱼"

# ================= 策略组配置（基于当前订阅全部节点，不依赖 proxy-providers） =================
proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - 负载均衡
      - 故障转移
      - 自动选择
      - 手动切换
      - 专用节点
      - 其他节点

  - name: 漏网之鱼
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - 专用节点
      - 其他节点

  - name: 负载均衡
    type: load-balance
    strategy: consistent-hashing
    url: http://www.gstatic.com/generate_204
    interval: 60
    lazy: true
    include-all: true

  - name: 故障转移
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 60
    lazy: true
    include-all: true

  - name: 自动选择
    type: url-test
    interval: 90
    tolerance: 50
    include-all: true

  - name: 手动切换
    type: select
    include-all: true

  - name: 专用节点
    filter: (?i)日本|川日|东京|深日|JP|Japan|香港|台湾
    type: url-test
    interval: 90
    tolerance: 50
    include-all: true

  - name: 其他节点
    exclude-filter: (?i)日本|川日|东京|深日|JP|Japan|香港|台湾
    type: url-test
    interval: 90
    tolerance: 50
    include-all: true

  - name: 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 应用净化
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: GLOBAL
    type: select
    proxies:
      - 负载均衡
      - 故障转移
      - 自动选择
      - 手动切换
      - 专用节点
      - 其他节点

